    <style>
      @keyframes sxShift{0%{background-position:0% 50%}100%{background-position:100% 50%}}

      @media (prefers-reduced-motion:no-preference){

      @keyframes dlgFade{from{opacity:0}}

         CSS בלבד, כדי שיתחיל מיד — עוד לפני שהאתר נטען — ומסתיר את זמן הטעינה. נגיעה מדלגת ─── -->
    <style>
      #sx-intro{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;
        background:#F0609E;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
      #sx-intro .si-open{position:absolute;inset:0;overflow:hidden;background:linear-gradient(140deg,#FF8A65 0%,#F0609E 52%,#9B6BFF 100%);
        clip-path:circle(80px at 50% 50%);animation:siOpen .8s .12s cubic-bezier(.77,0,.175,1) both}
      #sx-intro .si-b{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:siDrift 6s ease-in-out infinite alternate}
      #sx-intro .si-mark{position:relative;width:240px;height:240px;flex:none}

      #sx-intro .si-tb{transform-box:view-box;transform-origin:256px 256px;animation:siBeat .7s .28s cubic-bezier(.45,0,.2,1) both}
      #sx-intro .si-f{animation:siGlow .6s 1.1s cubic-bezier(.23,1,.32,1) both}
      #sx-intro .si-c{animation:siHop .82s var(--d) cubic-bezier(.45,0,.2,1) both}
      #sx-intro .si-p{opacity:0;animation:siPing .55s calc(var(--d) + .74s) cubic-bezier(.23,1,.32,1) forwards}
      #sx-intro .si-ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.7);opacity:0;animation:siRing 1s 1.15s cubic-bezier(.23,1,.32,1) forwards}
      #sx-intro .si-words{position:absolute;left:0;right:0;top:calc(50% + 128px);text-align:center}
      #sx-intro .si-w{overflow:hidden;padding:0 6px;line-height:1.15}
      #sx-intro .si-w span{display:block;font:700 clamp(34px,9vw,46px)/1.15 'Fredoka','Heebo',sans-serif;letter-spacing:.5px;animation:siUp .6s 1s cubic-bezier(.23,1,.32,1) both}
      #sx-intro .si-s{margin-top:6px;font:500 16px/1.4 'Heebo',sans-serif;opacity:.95;animation:siFade .55s 1.25s cubic-bezier(.23,1,.32,1) both}
      #sx-intro.si-out{animation:siOut .45s cubic-bezier(.23,1,.32,1) forwards;pointer-events:none}
      #sx-intro.si-out .si-mark{animation:siZoom .45s cubic-bezier(.23,1,.32,1) forwards}
      @keyframes siOpen{to{clip-path:circle(150vmax at 50% 50%)}}
      @keyframes siBeat{45%{transform:scale(1.1)}}
      @keyframes siGlow{50%{fill:rgba(255,255,255,.6)}}
      @keyframes siHop{0%{transform:none}42%{transform:translate(var(--x),var(--y)) scale(.72)}100%{transform:none}}
      @keyframes siPing{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.3)}}
      @keyframes siRing{0%{opacity:0;transform:scale(.55)}25%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
      @keyframes siUp{from{transform:translateY(110%)}}
      @keyframes siFade{from{opacity:0;transform:translateY(8px)}}
      @keyframes siDrift{to{transform:translate(var(--mx),var(--my)) scale(1.15)}}
      @keyframes siOut{to{opacity:0}}
      @keyframes siZoom{to{transform:scale(1.9)}}
      @media (prefers-reduced-motion:reduce){#sx-intro *,#sx-intro *::before{animation:none!important}#sx-intro .si-open{clip-path:none}#sx-intro.si-out{animation:siOut .3s ease forwards}}
    </style>

    <script>
      (function(){
        var el=document.getElementById('sx-intro'); if(!el) return;
        var forced=/[?&]intro=1/.test(location.search);
        var app=false; try{app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){}
        var guest=/^\/(invite|i)\//i.test(location.pathname)||/^#\/invite\//i.test(location.hash);
        var seen=false; try{seen=!!sessionStorage.getItem('sidor_intro')}catch(e){}
        if(!forced&&(!app||guest||seen)){el.parentNode.removeChild(el);return}
        try{sessionStorage.setItem('sidor_intro','1')}catch(e){}
        var reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
        var min=reduce?500:1950, t0=Date.now(), gone=false;
        function out(){ if(gone) return; gone=true; el.className='si-out'; setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el) },470) }
        function ready(){ var r=document.getElementById('root'); return r&&r.childElementCount>0 }
        (function tick(){ if(gone) return; var t=Date.now()-t0; if((t>=min&&ready())||t>4500) out(); else setTimeout(tick,100) })();
        el.addEventListener('pointerdown',out);
      })();
    </script>
