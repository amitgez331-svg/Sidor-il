    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Sidor-IL","url":"https://www.sidoril.com/","applicationCategory":"BusinessApplication","operatingSystem":"Web","inLanguage":"he","description":"סידורי הושבה ואישורי הגעה לחתונות ואירועים","offers":{"@type":"Offer","price":"100","priceCurrency":"ILS"}}</script>
    <style>
      @keyframes sxShift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
      .sx-btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.06)}
      .sx-btn:not(:disabled):active{transform:translateY(0) scale(.98)}
      .sx-btn-primary:not(:disabled):hover{animation:sxShift .8s ease forwards;box-shadow:0 14px 32px -8px rgba(240,96,158,.6)!important}
      .sx-btn:focus-visible{outline:3px solid #9B6BFF;outline-offset:2px}
      body{background:#FBF7FC}
      ::selection{background:#F9D3E4}
      /* ─── אנימציות מסך ההושבה ─── */
      @keyframes sxPopIn{0%{opacity:0;transform:scale(.55) translateY(14px)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
      @keyframes sxTwinkle{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes sxBlob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,24px) scale(.94)}}
      @keyframes sxShine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(320%)}}
      @keyframes sxChairPop{0%{transform:scale(.2)}55%{transform:scale(1.7)}100%{transform:scale(1)}}
      @keyframes sxBurst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(.3)}}
      @keyframes sxFloatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
      @keyframes sxConfetti{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
      @keyframes sxToastIn{0%{opacity:0;transform:translate(-50%,20px) scale(.9)}12%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px)}}
      .sx-fixture{transition:box-shadow .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:3px}
      .sx-fixture:hover{outline-color:#9B6BFF}
      .sx-fixture:active{cursor:grabbing!important}
      .sx-chair-new{transform-box:fill-box;transform-origin:center;animation:sxChairPop .55s cubic-bezier(.3,1.6,.5,1) both}
      .sx-shine{position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sxShine 2.6s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.sx-btn,.sx-btn:hover{transform:none!important;animation:none!important}
        .sx-anim,.sx-anim *,.sx-chair-new,.sx-shine{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
